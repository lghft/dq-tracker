<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Game Tracker Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f0f1e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #2a2a4e;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 2em;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .header p {
            color: #888;
            font-size: 0.95em;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 80px);
        }

        /* Sidebar - Account List */
        .sidebar {
            width: 280px;
            background: #16213e;
            border-right: 1px solid #2a2a4e;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a4e;
        }

        .sidebar-header h2 {
            color: #00d4ff;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .accounts-search {
            width: 100%;
            padding: 8px 12px;
            background: #0f0f1e;
            border: 1px solid #2a2a4e;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.95em;
        }

        .accounts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .account-item {
            padding: 12px;
            margin: 5px 0;
            background: #0f0f1e;
            border: 2px solid #2a2a4e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .account-item:hover {
            border-color: #00d4ff;
            background: #1a1a3e;
        }

        .account-item.active {
            border-color: #00d4ff;
            background: #1a3a5e;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .account-item-name {
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .account-item-stats {
            font-size: 0.85em;
            color: #888;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #2a2a4e;
        }

        .btn-new-account {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            color: #0f0f1e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-new-account:hover {
            background: #00e8ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f1e;
        }

        .content-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.1em;
            height: 100%;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2a4e;
            background: #16213e;
            padding: 0 20px;
        }

        .tab {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #888;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab:hover {
            color: #00d4ff;
        }

        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        /* Dashboard Tab */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            background: #16213e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .info-box:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .info-box-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box-value {
            color: #00d4ff;
            font-size: 2em;
            font-weight: bold;
        }

        .info-box-sub {
            color: #666;
            font-size: 0.85em;
            margin-top: 8px;
        }

        /* Logs Tab */
        .logs-container {
            max-width: 100%;
        }

        .log-entry {
            background: #16213e;
            border-left: 3px solid #00d4ff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-content {
            flex: 1;
        }

        .log-action {
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .log-details {
            color: #888;
            font-size: 0.9em;
        }

        .log-time {
            color: #666;
            font-size: 0.85em;
            text-align: right;
        }

        .log-empty {
            text-align: center;
            color: #555;
            padding: 40px;
        }

        /* Recent Items Tab */
        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: #16213e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .item-card.rarity-common {
            border-left: 4px solid #888;
        }

        .item-card.rarity-uncommon {
            border-left: 4px solid #1e9e00;
        }

        .item-card.rarity-rare {
            border-left: 4px solid #0066ff;
        }

        .item-card.rarity-epic {
            border-left: 4px solid #9933ff;
        }

        .item-card.rarity-legendary {
            border-left: 4px solid #ff9900;
        }

        .item-card.rarity-ultimate {
            border-left: 4px solid #ff0066;
        }

        .item-name {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .item-rarity {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-radius: 4px;
            font-size: 0.85em;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .item-stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a4e;
            font-size: 0.95em;
        }

        .item-stat:last-child {
            border-bottom: none;
        }

        .item-stat-label {
            color: #888;
        }

        .item-stat-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .item-empty {
            text-align: center;
            color: #555;
            padding: 40px;
        }

        /* Overview Tab */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .overview-box {
            background: #16213e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 25px;
        }

        .overview-title {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .overview-value {
            color: #00d4ff;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .best-items {
            background: #16213e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 20px;
        }

        .best-items h3 {
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .best-item-row {
            padding: 12px 0;
            border-bottom: 1px solid #2a2a4e;
            display: flex;
            justify-content: space-between;
        }

        .best-item-row:last-child {
            border-bottom: none;
        }

        .best-item-name {
            color: #e0e0e0;
        }

        .best-item-value {
            color: #00d4ff;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #16213e;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a4e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content h2 {
            color: #00d4ff;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: #0f0f1e;
            border: 1px solid #2a2a4e;
            border-radius: 6px;
            color: #e0e0e0;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #00d4ff;
            color: #0f0f1e;
        }

        .btn-primary:hover {
            background: #00e8ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: #2a2a4e;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #3a3a5e;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚔️ Game Tracker Dashboard</h1>
        <p>Multi-account progression tracker</p>
    </div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Accounts</h2>
                <input type="text" class="accounts-search" id="searchAccounts" placeholder="Search...">
            </div>
            <div class="accounts-list" id="accountsList"></div>
            <div class="sidebar-footer">
                <button class="btn-new-account" onclick="openNewAccountModal()">+ New Account</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div id="contentEmpty" class="content-empty">Select an account to view details</div>
            <div id="contentLoaded" style="display: none; flex: 1; display: flex; flex-direction: column;">
                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
                    <div class="tab" onclick="switchTab('logs')">📜 Logs</div>
                    <div class="tab" onclick="switchTab('items')">🎁 Recent Items</div>
                    <div class="tab" onclick="switchTab('overview')">📈 Overview</div>
                </div>

                <!-- Tab Contents -->
                <div class="tab-content active" id="tab-dashboard">
                    <div class="dashboard-grid" id="dashboardGrid"></div>
                </div>

                <div class="tab-content" id="tab-logs">
                    <div class="logs-container" id="logsContainer"></div>
                </div>

                <div class="tab-content" id="tab-items">
                    <div class="items-container" id="itemsContainer"></div>
                </div>

                <div class="tab-content" id="tab-overview">
                    <div class="overview-grid" id="overviewGrid"></div>
                    <div class="best-items" id="bestItemsBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Account Modal -->
    <div class="modal" id="newAccountModal">
        <div class="modal-content">
            <h2>Create New Account</h2>
            <input type="text" class="modal-input" id="newAccountName" placeholder="Account Name">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeNewAccountModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createNewAccount()">Create</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://outrageous-nocturnal-applicationstack--kevindinh616.replit.app';
        const userId = 'user123';

        let accounts = [];
        let selectedAccount = null;
        let selectedAccountIndex = null;
        let accountLogs = {};
        let accountBestItems = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchAccounts();
        });

        // Fetch accounts from backend
        async function fetchAccounts() {
            try {
                const res = await fetch(`${API_URL}/api/accounts/${userId}`);
                const data = await res.json();
                accounts = data.accounts || [];
                renderAccountsList();
            } catch (err) {
                console.error('Error fetching accounts:', err);
            }
        }

        // Render accounts list
        function renderAccountsList() {
            const list = document.getElementById('accountsList');
            list.innerHTML = accounts.map((account, i) => `
                <div class="account-item ${selectedAccountIndex === i ? 'active' : ''}" onclick="selectAccount(${i})">
                    <div class="account-item-name">${account.accountName}</div>
                    <div class="account-item-stats">
                        Level ${account.stats.level} • ${account.stats.gold.toLocaleString()} gold
                    </div>
                </div>
            `).join('');
        }

        // Select account
        function selectAccount(index) {
            selectedAccountIndex = index;
            selectedAccount = accounts[index];
            renderAccountsList();
            renderDashboard();
            switchTab('dashboard');
            document.getElementById('contentEmpty').style.display = 'none';
            document.getElementById('contentLoaded').style.display = 'flex';
        }

        // Render dashboard
        function renderDashboard() {
            const stats = selectedAccount.stats;
            const inventory = selectedAccount.inventory || [];
            
            // Calculate progress level
            const nextLevelXP = stats.level * 1000;
            const progressPercent = Math.min((stats.xp / nextLevelXP) * 100, 100);

            // Get best items
            const bestItems = inventory.sort((a, b) => (b.sellPrice || 0) - (a.sellPrice || 0)).slice(0, 3);

            const dashboardHTML = `
                <div class="info-box">
                    <div class="info-box-label">Level</div>
                    <div class="info-box-value">${stats.level}</div>
                </div>
                <div class="info-box">
                    <div class="info-box-label">Gold</div>
                    <div class="info-box-value">${stats.gold.toLocaleString()}</div>
                </div>
                <div class="info-box">
                    <div class="info-box-label">Total XP</div>
                    <div class="info-box-value">${stats.xp.toLocaleString()}</div>
                </div>
                <div class="info-box">
                    <div class="info-box-label">Items</div>
                    <div class="info-box-value">${inventory.length}</div>
                </div>
                <div class="info-box">
                    <div class="info-box-label">Level Progress</div>
                    <div class="info-box-value">${Math.floor(progressPercent)}%</div>
                    <div class="info-box-sub">${stats.xp.toLocaleString()} / ${nextLevelXP.toLocaleString()}</div>
                </div>
                <div class="info-box">
                    <div class="info-box-label">Best Item</div>
                    <div class="info-box-value">${bestItems.length > 0 ? bestItems[0].name : 'None'}</div>
                    <div class="info-box-sub">${bestItems.length > 0 ? bestItems[0].rarity : ''}</div>
                </div>
            `;

            document.getElementById('dashboardGrid').innerHTML = dashboardHTML;

            // Render other tabs
            renderLogs();
            renderItems();
            renderOverview();
        }

        // Render logs
        function renderLogs() {
            const accountName = selectedAccount.accountName;
            
            if (!accountLogs[accountName]) {
                accountLogs[accountName] = [];
            }

            const logs = accountLogs[accountName];
            const logsHTML = logs.length > 0 ? logs.map(log => `
                <div class="log-entry">
                    <div class="log-content">
                        <div class="log-action">${log.action}</div>
                        <div class="log-details">${log.details}</div>
                    </div>
                    <div class="log-time">${formatTime(log.timestamp)}</div>
                </div>
            `).join('') : '<div class="log-empty">No logs yet</div>';

            document.getElementById('logsContainer').innerHTML = logsHTML;
        }

        // Render recent items
        function renderItems() {
            const inventory = selectedAccount.inventory || [];
            
            if (inventory.length === 0) {
                document.getElementById('itemsContainer').innerHTML = '<div class="item-empty">No items yet</div>';
                return;
            }

            const recentItems = inventory.slice(-8).reverse();

            const itemsHTML = recentItems.map(item => {
                const isHighRarity = ['epic', 'legendary', 'ultimate'].includes(item.rarity);
                let potValue = 0;
                let upgradeCost = 0;

                if (isHighRarity && item.sellPrice) {
                    potValue = Math.floor(item.sellPrice * 1.5);
                    upgradeCost = Math.ceil(item.sellPrice * 0.75 * (item.currentUpgrade + 1));
                }

                return `
                    <div class="item-card rarity-${item.rarity}">
                        <div class="item-name">${item.name}</div>
                        <div class="item-rarity">${item.rarity}</div>
                        <div class="item-stat">
                            <span class="item-stat-label">Level Req:</span>
                            <span class="item-stat-value">${item.levelReq || 'N/A'}</span>
                        </div>
                        ${item.physicalDamage ? `
                            <div class="item-stat">
                                <span class="item-stat-label">Physical Damage:</span>
                                <span class="item-stat-value">${item.physicalDamage}</span>
                            </div>
                        ` : ''}
                        ${item.spellPower ? `
                            <div class="item-stat">
                                <span class="item-stat-label">Spell Power:</span>
                                <span class="item-stat-value">${item.spellPower}</span>
                            </div>
                        ` : ''}
                        ${item.physicalPower ? `
                            <div class="item-stat">
                                <span class="item-stat-label">Physical Power:</span>
                                <span class="item-stat-value">${item.physicalPower}</span>
                            </div>
                        ` : ''}
                        ${item.health ? `
                            <div class="item-stat">
                                <span class="item-stat-label">Health:</span>
                                <span class="item-stat-value">${item.health}</span>
                            </div>
                        ` : ''}
                        ${isHighRarity ? `
                            <div class="item-stat">
                                <span class="item-stat-label">Pot Value:</span>
                                <span class="item-stat-value">${potValue}</span>
                            </div>
                            <div class="item-stat">
                                <span class="item-stat-label">Next Upgrade Cost:</span>
                                <span class="item-stat-value">${upgradeCost}</span>
                            </div>
                        ` : ''}
                        <div class="item-stat">
                            <span class="item-stat-label">Upgrade Level:</span>
                            <span class="item-stat-value">${item.currentUpgrade}/${item.maxUpgrades}</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('itemsContainer').innerHTML = itemsHTML;
        }

        // Render overview
        function renderOverview() {
            const inventory = selectedAccount.inventory || [];
            const stats = selectedAccount.stats;

            // Calculate stats across all items
            const totalItems = inventory.length;
            const epicLegendaryCount = inventory.filter(i => ['epic', 'legendary', 'ultimate'].includes(i.rarity)).length;
            const totalPot = inventory.reduce((sum, item) => sum + (item.sellPrice || 0), 0);
            const avgLevel = totalItems > 0 ? Math.floor(inventory.reduce((sum, item) => sum + (item.currentUpgrade || 0), 0) / totalItems) : 0;

            const overviewHTML = `
                <div class="overview-box">
                    <div class="overview-title">Total Items</div>
                    <div class="overview-value">${totalItems}</div>
                </div>
                <div class="overview-box">
                    <div class="overview-title">Epic/Legendary/Ultimate</div>
                    <div class="overview-value">${epicLegendaryCount}</div>
                </div>
                <div class="overview-box">
                    <div class="overview-title">Total Gold</div>
                    <div class="overview-value">${stats.gold.toLocaleString()}</div>
                </div>
                <div class="overview-box">
                    <div class="overview-title">Total Pot Value</div>
                    <div class="overview-value">${totalPot.toLocaleString()}</div>
                </div>
                <div class="overview-box">
                    <div class="overview-title">Average Item Level</div>
                    <div class="overview-value">${avgLevel}</div>
                </div>
                <div class="overview-box">
                    <div class="overview-title">Total XP Earned</div>
                    <div class="overview-value">${stats.xp.toLocaleString()}</div>
                </div>
            `;

            document.getElementById('overviewGrid').innerHTML = overviewHTML;

            // Best items section
            const bestItems = inventory.sort((a, b) => (b.sellPrice || 0) - (a.sellPrice || 0)).slice(0, 5);
            const bestItemsHTML = `
                <h3>Top 5 Items by Value</h3>
                ${bestItems.map((item, i) => `
                    <div class="best-item-row">
                        <span class="best-item-name">${i + 1}. ${item.name} (${item.rarity})</span>
                        <span class="best-item-value">${item.sellPrice || 0}</span>
                    </div>
                `).join('')}
            `;

            document.getElementById('bestItemsBox').innerHTML = bestItemsHTML;
        }

        // Switch tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');
        }

        // Open new account modal
        function openNewAccountModal() {
            document.getElementById('newAccountModal').classList.add('show');
            document.getElementById('newAccountName').focus();
        }

        // Close modal
        function closeNewAccountModal() {
            document.getElementById('newAccountModal').classList.remove('show');
            document.getElementById('newAccountName').value = '';
        }

        // Create new account
        async function createNewAccount() {
            const accountName = document.getElementById('newAccountName').value;
            if (!accountName) {
                alert('Please enter an account name');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/accounts/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        accountName,
                        stats: { gold: 0, xp: 0, level: 1 },
                        inventory: []
                    })
                });

                if (res.ok) {
                    closeNewAccountModal();
                    await fetchAccounts();
                    // Add log entry
                    if (!accountLogs[accountName]) accountLogs[accountName] = [];
                    accountLogs[accountName].push({
                        action: 'Account Created',
                        details: 'New account initialized',
                        timestamp: new Date()
                    });
                }
            } catch (err) {
                alert('Error creating account: ' + err.message);
            }
        }

        // Add log entry (can be called by executor script)
        function addLog(accountName, action, details) {
            if (!accountLogs[accountName]) accountLogs[accountName] = [];
            accountLogs[accountName].unshift({
                action,
                details,
                timestamp: new Date()
            });

            if (selectedAccount && selectedAccount.accountName === accountName) {
                renderLogs();
            }
        }

        // Add item gained log
        function logItemGained(accountName, itemName, rarity) {
            addLog(accountName, '🎁 Item Gained', `${itemName} (${rarity})`);
        }

        // Format time
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            return `${days}d ago`;
        }

        // Allow executor script to send account data
        window.sendAccountData = function(accountName, stats, inventory) {
            // This function can be called by the executor script
            // Example: sendAccountData('Main', {gold: 5000, xp: 1200, level: 15}, [{...items}])
            fetch(`${API_URL}/api/accounts/${userId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    accountName,
                    stats,
                    inventory
                })
            }).then(() => {
                fetchAccounts();
                addLog(accountName, '📤 Data Updated', 'Account data synced from executor');
            });
        };
    </script>
</body>
</html>
